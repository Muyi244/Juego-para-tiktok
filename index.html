        /************************************************************************
         * 1. UTILIDADES GRÁFICAS Y MOTOR DE SONIDO SINTETIZADO
         ************************************************************************/
        function rr(ctx, x, y, w, h, r) {
            const rad = Math.max(0, Math.min(r || 0, Math.min(w, h) / 2));
            ctx.beginPath();
            ctx.moveTo(x + rad, y);
            ctx.lineTo(x + w - rad, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
            ctx.lineTo(x + w, y + h - rad);
            ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
            ctx.lineTo(x + rad, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
            ctx.lineTo(x, y + rad);
            ctx.quadraticCurveTo(x, y, x + rad, y);
            ctx.closePath();
        }

        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            tone(freq, type, dur, vol = 0.05, slide = null) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(Math.max(24, freq), now);
                    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(24, slide), now + dur);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + dur);
                } catch (e) {}
            }
            pump(ratio) { this.tone(68 + ratio * 120, 'sawtooth', 0.055, 0.045, 52); }
            crack() { this.tone(330, 'square', 0.06, 0.06, 75); }
            slam() {
                this.tone(210, 'sawtooth', 0.22, 0.08, 42);
                setTimeout(() => this.tone(480, 'square', 0.14, 0.06, 120), 55);
            }
            siren() { this.tone(660, 'sawtooth', 0.12, 0.035, 920); }
            explode() {
                [110, 80, 260, 523, 659, 880].forEach((f, i) => {
                    setTimeout(() => this.tone(f, i < 2 ? 'sawtooth' : 'square', 0.18, 0.075, f * 0.6), i * 42);
                });
            }
        }

        /************************************************************************

        function setupObject(idx = 0, forceBoss = false) {
            game.levelIdx = ((idx % OBJECT_CATALOG.length) + OBJECT_CATALOG.length) % OBJECT_CATALOG.length;
            const spec = OBJECT_CATALOG[game.levelIdx];
            game.roundCounter += 1;

            game.isBoss = Boolean(forceBoss || (game.roundCounter > 1 && game.roundCounter % 5 === 0));
            game.bossTime = 60.0;
            game.state = 'CRUSHING';
            game.explodedTimer = 0;
            game.crushLikes = 0;
            const bossMult = game.isBoss ? 1.8 : 1.0;
            const streakMult = 1 + Math.min(STREAK_LIFE_MAX, (game.champion ? game.champion.streak : 0) * STREAK_LIFE_STEP);
            game.lifeBonusPct = Math.round((streakMult - 1) * 100);
            game.regenBase = Math.max(30, Math.round(spec.baseLikes * bossMult));
            game.maxLikesRequired = Math.max(400, Math.round(spec.baseLikes * LIFE_MULT * bossMult * streakMult));
            game.visualRatio = 0;
            game.pistonHeat = game.feverTimer > 0 ? 1 : 0;
            game.shockwaveRadius = 0;
            game.puddles = [];
            game.pushers = {};
            game.teamBreak = 0;
            game.teamSave = 0;
            game.bolts = [];

            game.cracks = [];

                const pts = [];
                let cx = (Math.random() - 0.5) * 0.55;
                let cy = -0.42 + Math.random() * 0.25;
                pts.push({ x: cx, y: cy });
                for (let s = 0; s < 4; s++) {
                    cx += (Math.random() - 0.5) * 0.36;
                    cy += 0.18 + Math.random() * 0.14;
                    pts.push({ x: cx, y: Math.min(0.48, cy) });
                }
                game.cracks.push({ th: 0.14 + (i / 8) * 0.72, pts });
            }

            if (game.pendingLoot) {
                const eff = game.pendingLoot;
                game.pendingLoot = null;
                if (eff === 'ICE_TRAP') {
                    game.iceHp = Math.max(120, Math.round(game.maxLikesRequired * 0.20));
                } else if (eff === 'SHOCK') {
                    game.crushLikes = Math.round(game.maxLikesRequired * 0.35);
                    game.bolts.push({ life: 0.55 });
                    sfx.slam();
                } else if (eff === 'BOMB') {
                    game.crushLikes = Math.round(game.maxLikesRequired * 0.45);
                    game.shockwaveRadius = 15;
                    sfx.slam();
                }
            }
            game.checkpoint = Math.floor((game.crushLikes / game.maxLikesRequired) * 4) / 4 * game.maxLikesRequired;
        }

        function addPressure(likes, username = 'tiktok_user', banner = null) {
            if (game.state !== 'CRUSHING') return;
            const user = (username || 'user').replace(/^@/, '').trim() || 'user';
            const raw = Math.max(1, parseFloat(likes) || 1);

            game.comboCount += 1;
            game.comboTimer = 2.5;
            game.comboMult = game.comboCount >= 40 ? 16 : game.comboCount >= 25 ? 8 : game.comboCount >= 12 ? 4 : game.comboCount >= 5 ? 2 : 1;

            const fever = game.feverTimer > 0 ? 3.0 : 1.0;
            let dmg = Math.max(1, raw * fever * (1 + (game.comboMult - 1) * 0.08));

            game.valveAngle += 0.55 + Math.min(2.2, dmg * 0.06);
            game.teamBreak += Math.round(dmg);
            game.pushers[user] = (game.pushers[user] || 0) + Math.round(dmg);
            game.lastEventText = `❤️ @${user.slice(0, 12)} (+${Math.round(raw)} Likes)`;

            if (game.iceHp > 0) {
                game.iceHp = Math.max(0, game.iceHp - dmg);
                game.shakeTimer = 0.16;
                sfx.crack();
                if (game.floatingTexts.length < 5) {
                    game.floatingTexts.push({
                        text: game.iceHp <= 0 ? '💥 ¡HIELO ROTO!' : `❄️ -${Math.round(dmg)} HIELO`,
                        x: W / 2 + (Math.random() - 0.5) * 140,
                        y: 255,
                        vy: -55,
                        col: '#38bdf8',
                        life: 0.65
                    });
                }
                return;
            }

            const prev = game.crushLikes / game.maxLikesRequired;
            game.crushLikes = Math.min(game.maxLikesRequired, game.crushLikes + dmg);
            const ratio = game.crushLikes / game.maxLikesRequired;

            const cpNow = Math.floor(ratio * 4) / 4 * game.maxLikesRequired;
            if (ratio < 1 && cpNow > game.checkpoint) {
                game.checkpoint = cpNow;
                game.floatingTexts.push({
                    text: `🔒 CHECKPOINT ${Math.round((cpNow / game.maxLikesRequired) * 100)}%`,
                    x: W / 2,
                    y: 300,
                    vy: -45,
                    col: '#38bdf8',
                    life: 1.2
                });
                sfx.tone(520, 'sine', 0.16, 0.06, 880);
            }

            game.shakeTimer = Math.min(0.5, 0.06 + dmg * 0.008 + (ratio > 0.85 ? 0.15 : 0));

            if (banner) sfx.slam();
            else if (Math.floor(ratio * 6) > Math.floor(prev * 6)) sfx.crack();
            else sfx.pump(ratio);

            const spec = OBJECT_CATALOG[game.levelIdx];
            const anvilY = 444;
            const curH = Math.max(32, 185 * (1 - ratio * 0.78));
            const curW = 220 * (1 + ratio * 0.72);

            for (let i = 0; i < Math.min(14, 2 + Math.floor(dmg * 0.3)); i++) {
                const side = Math.random() < 0.5 ? -1 : 1;

                    x: W / 2 + side * (curW * 0.36),

                    vRot: (Math.random() - 0.5) * 14,
                    life: 0.55 + Math.random() * 0.35
                });
            }

            if (spec.liqCol && ratio > 0.22 && game.puddles.length < 14) {
                game.puddles.push({
                    ox: (Math.random() - 0.5) * (curW + 24),
                    w: 20 + Math.random() * 28,
                    col: spec.liqCol
                });
            }

            if (game.floatingTexts.length < 5 || banner) {
                game.floatingTexts.push({
                    text: banner || `+${Math.round(dmg)}L @${user.slice(0, 9)}`,
                    x: W / 2 + (Math.random() - 0.5) * 170,
                    y: 265 + (Math.random() - 0.5) * 45,
                    vy: -60,
                    col: banner ? '#facc15' : game.feverTimer > 0 ? '#fb923c' : '#2aff00',

            if (game.crushLikes >= game.maxLikesRequired) {

        function liftPress(user = 'salvar', pct = 0.18) {

        /************************************************************************
         * 4. RENDERIZADO COMPLETO DEL OVERLAY EN EL LIENZO (520x640)
         ************************************************************************/
        function drawText(txt, x, y, sz, col, align = 'center', stroke = 5) {
            ctx.save();
            ctx.font = `${sz}px ${FONT}`;
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            if (stroke > 0) {
                ctx.lineWidth = stroke;
                ctx.strokeStyle = '#000000';
                ctx.lineJoin = 'round';
                ctx.strokeText(txt, x, y);
            }
            ctx.fillStyle = col;
            ctx.fillText(txt, x, y);
            ctx.restore();
        }

        function drawCrown(cx, cy, scale, t) {
            ctx.save();
            ctx.translate(cx, cy + Math.sin((t || 0) * 4) * 1.2);
            ctx.scale(scale, scale);
            ctx.fillStyle = '#facc15';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(-19, 10);
            ctx.lineTo(-22, -10);
            ctx.lineTo(-10, -2);
            ctx.lineTo(0, -14);
            ctx.lineTo(10, -2);
            ctx.lineTo(22, -10);
            ctx.lineTo(19, 10);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(0, 3, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(-11, 5, 2.4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(11, 5, 2.4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawHazard(x, y, w, h) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.clip();
            ctx.fillStyle = '#facc15';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#111827';
            for (let sx = x - h; sx < x + w + h; sx += 34) {
                ctx.beginPath();
                ctx.moveTo(sx, y + h);
                ctx.lineTo(sx + 17, y + h);
                ctx.lineTo(sx + 17 + h, y);
                ctx.lineTo(sx + h, y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, h);
        }

        function panel(x, y, w, h, border, fill = 'rgba(8, 12, 22, 0.92)', r = 8) {
            ctx.save();
            rr(ctx, x, y, w, h, r);
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.shadowColor = border;
            ctx.shadowBlur = 6;
            ctx.lineWidth = 2;
            ctx.strokeStyle = border;
            ctx.stroke();
            ctx.restore();
        }

        function fitText(txt, x, y, size, col, align, maxW, stroke = 3) {
            let sz = size;
            ctx.save();
            ctx.font = `${sz}px ${FONT}`;
            while (sz > 7 && ctx.measureText(txt).width > maxW) {
                sz -= 0.5;
                ctx.font = `${sz}px ${FONT}`;
            }
            ctx.restore();
            drawText(txt, x, y, sz, col, align, stroke);
        }

        function renderCornerOverlay(t) {
            try {
                const spec = OBJECT_CATALOG[game.levelIdx] || OBJECT_CATALOG[0];
                const ratio = Math.max(0, Math.min(1, game.visualRatio));
                const tons = (ratio * spec.maxTons).toFixed(1);
                const pct = Math.round(ratio * 100);
                const bounty = spec.maxTons * 12 + (game.isBoss ? 4000 : 500);

                // ---- Pantalla completa (transparente fuera del "cartucho") ----
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (game.chromaMode) {
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                } else if (!TRANSPARENT) {
                    ctx.fillStyle = '#05070d';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
                ctx.setTransform(view.k, 0, 0, view.k, view.ox, view.oy);

                ctx.save();
                rr(ctx, 0, 0, LW, LH, 12);
                ctx.clip();

                if (game.shakeTimer > 0) {
                    const m = Math.min(5, game.shakeTimer * 10);
                    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
                }

                // ---- Fondo del cartucho ----
                const bg = ctx.createLinearGradient(0, 0, 0, LH);
                bg.addColorStop(0, '#0a0f1d');

                // ---- HUD SUPERIOR ----
                panel(4, 4, 292, 34, game.isBoss ? '#facc15' : '#38bdf8', game.isBoss ? 'rgba(60, 10, 10, 0.95)' : 'rgba(8, 12, 22, 0.95)');
                ctx.save();

                ctx.fillStyle = game.wsConnected ? '#2aff00' : '#ef4444';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(15, 21, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                fitText(`${spec.icon}${spec.badge} ${spec.shortName}`, 26, 15, 15, '#ffffff', 'left', 175, 4);

                // ---- ARENA (el mundo reducido) ----
                ctx.save();
                rr(ctx, ARENA.x, ARENA.y, ARENA.w, ARENA.h, 8);
                ctx.clip();

                const ag = ctx.createLinearGradient(0, ARENA.y, 0, ARENA.y + ARENA.h);
                ag.addColorStop(0, '#0c1426');
                ag.addColorStop(1, '#182544');
                ctx.fillStyle = ag;
                ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
                ctx.lineWidth = 1;
                for (let x = ARENA.x; x < ARENA.x + ARENA.w; x += 16) {
                    ctx.beginPath(); ctx.moveTo(x, ARENA.y); ctx.lineTo(x, ARENA.y + ARENA.h); ctx.stroke();
                }
                for (let y = ARENA.y; y < ARENA.y + ARENA.h; y += 16) {
                    ctx.beginPath(); ctx.moveTo(ARENA.x, y); ctx.lineTo(ARENA.x + ARENA.w, y); ctx.stroke();
                }

                // Mundo (coordenadas originales 520x640, reducidas)
                ctx.save();
                ctx.translate(0, ARENA.y - WORLD_TOP * WS);
                ctx.scale(WS, WS);

                ctx.fillStyle = '#1e293b';
                ctx.fillRect(8, 86, 18, 362);

                const anvilY = 444;

                    anvilY - 12,
                    Math.max(186, (anvilY - curH) - (ratio < 0.03 ? (1 - ratio / 0.03) * 16 : 0))

                drawHydraulicPiston(pistonBottomY, tons, t);

                if (game.state === 'CRUSHING') {
                    drawDeformableObject(spec, W / 2, anvilY, curW, curH, ratio, t);

                game.bolts.forEach(() => {

                game.particles.forEach(pt => {

                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2.5;
                    ctx.fillRect(-pt.sz / 2, -pt.sz / 2, pt.sz, pt.sz * 0.85);

                game.floatingTexts.forEach(ft => {

                // Banner de evento (pastilla sobre la arena)

                if (game.state === 'CRUSHING' && ratio >= 0.85) {

                    bannerBg = '#7f1d1d';
                    bannerTxt = `👑 BOSS · ${game.bossTime.toFixed(1)}s`;
                    bannerCol = '#2aff00';
                }
                rr(ctx, ARENA.x + 14, ARENA.y + 5, ARENA.w - 28, 17, 7);
                ctx.fillStyle = bannerBg;
                ctx.fill();
                fitText(bannerTxt, LW / 2, ARENA.y + 14, 11, bannerCol, 'center', ARENA.w - 44, bannerCol === '#000000' ? 0 : 3);

                ctx.restore(); // fin del clip de la arena
                rr(ctx, ARENA.x, ARENA.y, ARENA.w, ARENA.h, 8);
                ctx.save();
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 6;
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#38bdf8';
                ctx.stroke();
                ctx.restore();

                // ---- BARRA DE VIDA ----
                const bx = 4, by = 267, bw = 292, bh = 22;
                const sirenFlash = ratio >= 0.85 && Math.sin(t * 24) > 0;
                ctx.save();
                rr(ctx, bx, by, bw, bh, 7);
                ctx.fillStyle = '#05070d';
                ctx.fill();
                ctx.clip();
                const fillCol = sirenFlash ? '#ffffff' : ratio < 0.5 ? '#22c55e' : ratio < 0.85 ? '#facc15' : '#ef4444';
                ctx.fillStyle = fillCol;
                ctx.fillRect(bx, by, bw * ratio, bh);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(bx, by, bw * ratio, bh * 0.4);
                // Checkpoints 25/50/75
                [0.25, 0.5, 0.75].forEach(q => {
                    const locked = game.maxLikesRequired > 0 && game.checkpoint / game.maxLikesRequired >= q - 0.001;
                    ctx.fillStyle = locked ? 'rgba(56, 189, 248, 0.95)' : 'rgba(255, 255, 255, 0.35)';
                    ctx.fillRect(bx + bw * q - 1, by + 2, 2, bh - 4);
                });
                ctx.restore();
                rr(ctx, bx, by, bw, bh, 7);
                ctx.lineWidth = 2;
                ctx.strokeStyle = sirenFlash ? '#ef4444' : '#ffffff';
                ctx.stroke();
                const remLikes = Math.max(0, Math.ceil(game.maxLikesRequired - game.crushLikes));
                fitText(`${pct}% · FALTAN ${remLikes}`, LW / 2, by + bh / 2 + 1, 15, sirenFlash ? '#dc2626' : '#ffffff', 'center', bw - 16, 5);

                // ---- TARJETA DEL REY ----
                const champ = game.champion;
                panel(4, 293, 176, 54, champ ? '#facc15' : '#475569');

                if (!champ) ctx.globalAlpha = 0.3;
                drawCrown(26, 320, 0.8, t);
                ctx.restore();
                if (champ) {
                    drawText('REY ACTUAL', 48, 304, 9, '#94a3b8', 'left', 2);
                    fitText(`@${champ.user}`, 48, 318, 15, '#ffffff', 'left', 126, 4);
                    drawText(`RACHA x${champ.streak}`, 48, 336, 14, '#fb923c', 'left', 4);
                    drawText(`+${game.lifeBonusPct || 0}% VIDA`, 172, 336, 10, '#f87171', 'right', 3);
                } else {
                    drawText('SIN REY', 48, 315, 15, '#94a3b8', 'left', 3);
                    fitText('¡ROMPE UNO Y GANA LA CORONA!', 48, 334, 10, '#64748b', 'left', 126, 2);
                }

                // ---- TARJETA TONS / COMBO ----
                panel(184, 293, 112, 54, '#facc15');
                drawText(`${tons} T`, 240, 311, 21, '#2aff00', 'center', 5);
                drawText(`COMBO x${game.comboMult}`, 240, 330, 13, '#fde047', 'center', 4);
                if (game.comboCount > 0) {
                    ctx.fillStyle = 'rgba(250, 204, 21, 0.9)';
                    ctx.fillRect(196, 339, 88 * Math.max(0, Math.min(1, game.comboTimer / 2.5)), 3);
                }

                // ---- BARRA DE EVENTOS ----
                panel(4, 351, 292, 25, 'rgba(56, 189, 248, 0.6)');
                fitText(`📡 ${game.lastEventText}`, 12, 364, 11, '#2aff00', 'left', 205, 3);
                drawText(`💥 ${game.totalCrushed}`, 288, 364, 12, '#fde047', 'right', 3);

                // ---- POPUP DE VICTORIA ----
                if (game.state === 'EXPLODED' && game.winnerInfo) {
                    const w = game.winnerInfo;
                    const px = 14, py = 50, pw = 272, ph = 206;
                    panel(px, py, pw, ph, '#2aff00', 'rgba(6, 10, 18, 0.96)', 12);
                    drawText('💥 ¡DESTRUIDO! 💥', LW / 2, py + 22, 24, '#2aff00', 'center', 6);
                    fitText(`${w.icon} ${w.name}`, LW / 2, py + 44, 12, '#cbd5e1', 'center', pw - 20, 3);

                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(px + 40, py + 82, 19, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#000000';
                    ctx.stroke();
                    drawCrown(px + 40, py + 82, 0.66, t);

                    fitText(`@${w.user}`, px + 68, py + 73, 17, '#ffffff', 'left', pw - 84, 4);
                    if (w.streak > 1) {
                        drawText(`🔥 RACHA x${w.streak}`, px + 68, py + 93, 15, '#fb923c', 'left', 4);
                    } else {
                        drawText('¡NUEVO REY!', px + 68, py + 93, 15, '#facc15', 'left', 4);
                    }
                    if (w.dethroned) {
                        drawText(`✖ cayó @${w.dethroned.slice(0, 10)}`, LW / 2, py + 113, 11, '#f87171', 'center', 3);
                    }
                    drawText(`ROBÓ $${w.cash}`, LW / 2, py + 133, 22, '#fde047', 'center', 5);

                    if (w.loot) {
                        rr(ctx, px + 10, py + 148, pw - 20, 50, 8);
                        ctx.fillStyle = '#1e293b';
                        ctx.fill();
                        ctx.strokeStyle = w.loot.color;
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                        fitText(`🎁 ${w.loot.icon} ${w.loot.name}`, LW / 2, py + 164, 13, w.loot.color, 'center', pw - 44, 4);
                        fitText(w.loot.desc, LW / 2, py + 184, 11, '#ffffff', 'center', pw - 44, 3);
                    }
                }

                // ---- Acabado arcade: viñeta + scanlines (no en chroma) ----
                if (!game.chromaMode) {
                    const vg = ctx.createRadialGradient(LW / 2, LH / 2, LH * 0.35, LW / 2, LH / 2, LH * 0.78);
                    vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
                    vg.addColorStop(1, 'rgba(0, 0, 0, 0.38)');
                    ctx.fillStyle = vg;
                    ctx.fillRect(0, 0, LW, LH);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.10)';
                    for (let y = 0; y < LH; y += 3) ctx.fillRect(0, y, LW, 1);
                }

                // Marco del cartucho
                ctx.restore();
                ctx.save();
                rr(ctx, 1, 1, LW - 2, LH - 2, 11);
                ctx.lineWidth = 2;
                ctx.strokeStyle = game.isBoss ? '#facc15' : '#1e3a5f';
                ctx.stroke();
                ctx.restore();
            } catch (e) {
                console.error(e);
            }
        }

        function drawHydraulicPiston(pistonBottomY, tons, t) {
            const cx = W / 2;
            const headH = 66;
            const headW = 365;
            const headTopY = pistonBottomY - headH;

            // Cilindro central de acero
            const shaftW = 104;
            const sg = ctx.createLinearGradient(cx - shaftW / 2, 0, cx + shaftW / 2, 0);
            sg.addColorStop(0, '#475569');
            sg.addColorStop(0.4, '#f8fafc');
            sg.addColorStop(0.7, '#94a3b8');
            sg.addColorStop(1, '#1e293b');
            ctx.fillStyle = sg;
            ctx.fillRect(cx - shaftW / 2, 106, shaftW, Math.max(10, headTopY - 106));
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3.5;
            ctx.strokeRect(cx - shaftW / 2, 106, shaftW, Math.max(10, headTopY - 106));

            // Válvula roja giratoria en el cilindro central
            const valveY = Math.min(headTopY - 24, 142);
            if (valveY >= 122) {
                ctx.save();
                ctx.translate(cx, valveY);
                ctx.rotate(game.valveAngle);
                ctx.beginPath();
                ctx.arc(0, 0, 17, 0, Math.PI * 2);
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#dc2626';
                ctx.stroke();
                for (let i = 0; i < 4; i++) {
                    ctx.rotate(Math.PI / 2);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(17, 0);
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#facc15';
                ctx.fill();
                ctx.restore();
            }

            // Barras guía secundarias
            [-125, 125].forEach(ox => {
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(cx + ox - 12, 106, 24, Math.max(10, headTopY - 106));
                ctx.strokeRect(cx + ox - 12, 106, 24, Math.max(10, headTopY - 106));
            });

            // Franja amarilla y negra en el cabezal
            drawHazard(cx - headW / 2, headTopY, headW, 20);

            // Cabezal de acero (se pone al rojo vivo con regalos o fiebre)
            const pg = ctx.createLinearGradient(0, headTopY + 20, 0, pistonBottomY);
            if (game.pistonHeat > 0.15) {
                pg.addColorStop(0, '#7f1d1d');
                pg.addColorStop(0.5, '#ea580c');
                pg.addColorStop(1, '#fde047');
            } else {
                pg.addColorStop(0, '#334155');
                pg.addColorStop(0.5, '#64748b');
                pg.addColorStop(1, '#1e293b');
            }
            ctx.fillStyle = pg;
            ctx.fillRect(cx - headW / 2, headTopY + 20, headW, headH - 20);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.strokeRect(cx - headW / 2, headTopY + 20, headW, headH - 20);

            // Pantalla LED sobre el pistón
            ctx.fillStyle = '#090d16';
            ctx.fillRect(cx - 150, headTopY + 26, 300, 32);
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(cx - 150, headTopY + 26, 300, 32);

            drawText(
                game.iceHp > 0
                    ? `❄️ HIELO (${Math.ceil(game.iceHp)} LIKES) ❄️`
                    : `⚠️ PRENSA: ${tons} TONELADAS ⚠️`,
                cx,
                headTopY + 42,
                17,
                game.iceHp > 0 ? '#38bdf8' : game.pistonHeat > 0.15 ? '#fde047' : '#2aff00',
                'center',
                5
            );

            if (game.iceHp > 0) {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.42)';
                ctx.strokeStyle = '#e0f2fe';
                ctx.lineWidth = 4;
                ctx.fillRect(cx - headW / 2 - 5, headTopY - 4, headW + 10, headH + 8);
                ctx.strokeRect(cx - headW / 2 - 5, headTopY - 4, headW + 10, headH + 8);
            }

            // Cascos/Avatares de espectadores haciendo peso sobre la viga de acero
            const topP = Object.entries(game.pushers).sort((a, b) => b[1] - a[1]).slice(0, 6);
            const champ = game.champion;
            if (champ) {
                const ck = Object.keys(game.pushers).find(k => k.toLowerCase() === champ.user.toLowerCase());
                if (ck && !topP.some(e => e[0] === ck)) {
                    topP[topP.length >= 6 ? 5 : topP.length] = [ck, game.pushers[ck]];
                }
            }
            topP.forEach((entry, idx) => {
                const px = cx + (idx - (topP.length - 1) / 2) * 58;
                const py = headTopY - 14 - Math.abs(Math.sin(t * 12 + idx)) * 4;
                if (py > 116) {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(px, py, 11, Math.PI, 0);
                    ctx.fill();
                    ctx.stroke();
                    drawText(`@${entry[0].slice(0, 5)}`, px, py - 15, 15, '#ffffff', 'center', 4);
                    if (champ && entry[0].toLowerCase() === champ.user.toLowerCase()) {
                        drawCrown(px - 8, py - 36, 0.8, t);
                        drawText(`x${champ.streak}`, px + 8, py - 36, 16, '#facc15', 'left', 4);
                    }
                }
            });
        }

        function drawDeformableObject(spec, cx, anvilY, curW, curH, ratio, t) {
            ctx.save();
            const vib = ratio > 0.3 ? Math.sin(t * 55) * (ratio * 5.5) : 0;
            const x = cx + vib;
            const y = anvilY - curH / 2;
            const rx = curW / 2;
            const ry = curH / 2;

            if (spec.glowCol || ratio > 0.65) {
                ctx.save();
                const glow = spec.glowCol || '#ef4444';
                ctx.shadowColor = glow;
                ctx.shadowBlur = 22;
                ctx.fillStyle = glow;
                ctx.globalAlpha = 0.28;
                ctx.beginPath();
                ctx.ellipse(x, y, rx + 8, ry + 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Dibujo vectorial específico para cada uno de los 50 objetos en espacio local (-100..100)
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(rx / 100, ry / 100);
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            const c1 = spec.col1;
            const c2 = spec.col2;
            const oc1 = spec.origCol1 || c1;
            const oc2 = spec.origCol2 || c2;
            const strokeB = () => {
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 5;
                ctx.stroke();
            };

            switch (spec.id) {
                case 'watermelon': {
                    // Corteza verde ovalada con rayas oscuras y pulpa roja con semillas al aplastarse
                    ctx.fillStyle = c1;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 96, 90, 0, 0, Math.PI * 2);
                    ctx.fill();
                    strokeB();

                    ctx.save();
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 93, 87, 0, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.strokeStyle = '#064e3b';
                    ctx.lineWidth = 10;
                    [-62, -31, 0, 31, 62].forEach(sx => {
                        ctx.beginPath();
                        ctx.moveTo(sx - 8, -92);
                        ctx.bezierCurveTo(sx + 14, -30, sx - 14, 30, sx + 8, 92);
                        ctx.stroke();
                    });
                    // Pulpa roja interna visible en corte central y abriéndose con la presión
                    const pulpR = 44 + ratio * 38;
                    ctx.fillStyle = '#dcfce7';
                    ctx.beginPath();
                    ctx.ellipse(0, 8, pulpR + 7, (pulpR + 7) * 0.72, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = oc2;
                    ctx.beginPath();
                    ctx.ellipse(0, 8, pulpR, pulpR * 0.68, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 3.5;
                    ctx.stroke();
                    ctx.fillStyle = '#111827';
                    [[-22, 2], [0, -6], [22, 2], [-14, 18], [14, 18], [0, 22]].forEach(([px, py]) => {
                        ctx.beginPath();
                        ctx.ellipse(px, py, 3.8, 6, 0, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.restore();
                    break;
                }

                case 'nokia3310':
                case 'nokia_max': {
                    const isMax = spec.id === 'nokia_max';
                    // Antena superior clásica
                    rr(ctx, 32, -104, 18, 22, 6);
                    ctx.fillStyle = '#1e293b';
                    ctx.fill();
                    strokeB();

                    // Carcasa curvada característica del Nokia 3310
                    rr(ctx, -68, -92, 136, 186, 30);
                    ctx.fillStyle = c1;
                    ctx.fill();
                    strokeB();

                    // Bisel plateado alrededor de la pantalla y tecla central
                    rr(ctx, -56, -78, 112, 92, 18);
                    ctx.fillStyle = '#cbd5e1';
                    ctx.fill();
                    ctx.lineWidth = 3.5;
                    ctx.stroke();

                    // Pantalla LCD verde clásica con barras de señal/batería y viborita
                    rr(ctx, -46, -68, 92, 54, 7);
                    ctx.fillStyle = '#84cc16';
                    ctx.fill();
                    ctx.lineWidth = 3.5;
                    ctx.stroke();
                    ctx.fillStyle = '#1a2e05';
                    for (let b = 0; b < 4; b++) {
                        ctx.fillRect(-41, -30 - b * 8, 5 + b * 2, 5);
                        ctx.fillRect(36 - b * 2, -30 - b * 8, 5 + b * 2, 5);
                    }
                    ctx.font = 'bold 14px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(isMax ? 'NOKIA MAX' : 'NOKIA', 0, -48);
                    ctx.fillRect(-24, -36, 34, 4);
                    ctx.fillRect(10, -36, 4, 12);

                    // Botón Navi azul y teclas laterales
                    rr(ctx, -22, -8, 44, 13, 6);
                    ctx.fillStyle = '#f8fafc';
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(-12, -4, 24, 5);

                    // Teclado numérico 3x4 ovalado

                    // Lámpara de lava bicónica con burbujas incandescentes flotando
                    ctx.fillStyle = '#475569';
                    ctx.beginPath();
                    ctx.moveTo(-48, 92);
                    ctx.lineTo(48, 92);
                    ctx.lineTo(32, 42);
                    ctx.lineTo(-32, 42);
                    ctx.closePath();
                    ctx.fill();
                    strokeB();

                    ctx.fillStyle = c1;
                    ctx.beginPath();
                    ctx.moveTo(-24, -88);
                    ctx.lineTo(24, -88);
                    ctx.lineTo(52, 42);
                    ctx.lineTo(-52, 42);
                    ctx.closePath();
                    ctx.fill();
                    strokeB();

                    ctx.fillStyle = '#f97316';
                    [[0, 12, 22], [-12, -26, 15], [10, -56, 12]].forEach(([bx, by, br]) => {
                        ctx.beginPath();
                        ctx.arc(bx, by, br, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    break;
                }

                case 'hourglass': {
                    // Reloj de arena con marcos de oro y doble ampolla de vidrio
                    rr(ctx, -68, -92, 136, 18, 6);
                    ctx.fillStyle = c1;
                    ctx.fill();
                    strokeB();
                    rr(ctx, -68, 74, 136, 18, 6);
                    ctx.fill();
                    strokeB();

                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.moveTo(-52, -74);
                    ctx.lineTo(52, -74);
                    ctx.lineTo(8, 0);
                    ctx.lineTo(52, 74);
                    ctx.lineTo(-52, 74);
                    ctx.lineTo(-8, 0);
                    ctx.closePath();
                    ctx.fill();
                    strokeB();
                    break;
                }

                case 'globe': {
                    // Globo terráqueo con continentes verdes y soporte meridiano dorado
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 9;
                    ctx.beginPath();
                    ctx.arc(0, -6, 80, -Math.PI * 0.6, Math.PI * 0.6);
                    ctx.stroke();

                    ctx.fillStyle = c1;
                    ctx.beginPath();
                    ctx.arc(0, -6, 66, 0, Math.PI * 2);
                    ctx.fill();
                    strokeB();

                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.ellipse(-22, -18, 24, 18, 0.3, 0, Math.PI * 2);
                    ctx.ellipse(22, 12, 22, 26, -0.2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                }

                case 'microscope': {
                    // Microscopio óptico de laboratorio con brazo curvo, platina y tubo ocular
                    rr(ctx, -68, 68, 136, 24, 8);
                    ctx.fillStyle = '#0f172a';
                    ctx.fill();
                    strokeB();

                    ctx.strokeStyle = c1;
                    ctx.lineWidth = 22;
                    ctx.beginPath();
                    ctx.moveTo(18, 68);
                    ctx.quadraticCurveTo(68, 0, 12, -52);
                    ctx.stroke();

                    rr(ctx, -28, -92, 32, 76, 6);
                    ctx.fillStyle = c1;
                    ctx.fill();
                    strokeB();
                    ctx.fillStyle = '#111827';
                    ctx.fillRect(-52, 18, 76, 12);
                    break;
                }

                case 'telescope': {
                    // Telescopio astronómico inclinado sobre su trípode
                    ctx.strokeStyle = '#92400e';
                    ctx.lineWidth = 10;
                    ctx.beginPath();
                    ctx.moveTo(0, 6);
                    ctx.lineTo(-56, 90);
                    ctx.moveTo(0, 6);
                    ctx.lineTo(56, 90);
                    ctx.moveTo(0, 6);
                    ctx.lineTo(0, 92);
                    ctx.stroke();

                    ctx.save();
                    ctx.rotate(-0.35);
                    rr(ctx, -84, -32, 168, 46, 10);
                    ctx.fillStyle = c1;
                    ctx.fill();
                    strokeB();
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(68, -30, 16, 42);
                    ctx.restore();
                    break;
                }

                case 'tank_mini': {
                    // Tanque militar blindado con orugas, torreta y cañón
                    rr(ctx, -92, 28, 184, 56, 26);
                    ctx.fillStyle = '#1e293b';
                    ctx.fill();
                    strokeB();
                    [-60, -20, 20, 60].forEach(wx => {
                        ctx.fillStyle = '#475569';
                        ctx.beginPath();
                        ctx.arc(wx, 56, 18, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    });

                    rr(ctx, -78, -14, 156, 46, 10);
                    ctx.fillStyle = c1;
                    ctx.fill();
                    strokeB();

                    // Torreta superior y cañón largo
                    rr(ctx, 18, -52, 82, 18, 6);
                    ctx.fillStyle = c1;
                    ctx.fill();
                    strokeB();
                    ctx.beginPath();
                    ctx.arc(-8, -14, 44, Math.PI, 0);
                    ctx.fill();
                    strokeB();
                    break;
                }

                case 'black_hole': {
                    // Agujero negro supermasivo con disco de acreción luminoso y horizonte de sucesos
                    ctx.save();
                    ctx.rotate(-0.22);
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 96, 32, 0, 0, Math.PI * 2);
                    ctx.fill();
                    strokeB();
                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 76, 18, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(0, 0, 48, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#f97316';
                    ctx.lineWidth = 5;
                    ctx.stroke();
                    break;
                }

                case 'quantum':
                default: {
                    // Núcleo cuántico con anillos giroscópicos cruzados y singularidad brillante
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.arc(0, 0, 88, 0, Math.PI * 2);
                    ctx.fill();
                    strokeB();

                    [0, Math.PI / 3, -Math.PI / 3].forEach((ang, idx) => {
                        ctx.save();
                        ctx.rotate(ang + t * (idx % 2 === 0 ? 2.2 : -2.2));
                        ctx.strokeStyle = idx === 0 ? '#2aff00' : c1;
                        ctx.lineWidth = 9;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 84, 32, 0, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.restore();
                    });

                    // Estrella de singularidad central
                    ctx.fillStyle = '#2aff00';
                    ctx.beginPath();
                    ctx.arc(0, 0, 26 + Math.sin(t * 16) * 4, 0, Math.PI * 2);
                    ctx.fill();
                    strokeB();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                }
            }

            // Brillo o tinte especial del material (Oro, Lava, Glaciar, Diamante, etc.)
            if (spec.matTint) {
                ctx.fillStyle = spec.matTint;
                ctx.globalAlpha = 0.16;
                ctx.beginPath();
                ctx.arc(0, 0, 86, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            ctx.restore();

            // Nombre corto del objeto en la base con borde negro nítido
            drawText(
                spec.shortName,
                x,
                y + ry * 0.64,
                Math.max(12, Math.round(17 * (1 - ratio * 0.25))),
                '#ffffff',
                'center',
                5
            );

            // Grietas progresivas a medida que se aplasta
            ctx.strokeStyle = spec.crackCol || '#000000';
            ctx.lineWidth = 3.5;
            game.cracks.forEach(cr => {
                if (ratio >= cr.th) {
                    ctx.beginPath();
                    cr.pts.forEach((pt, idx) => {
                        const px = x + pt.x * curW;
                        const py = y + pt.y * curH;
                        if (idx === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    });
                    ctx.stroke();
                }
            });

            ctx.restore();
        }

        function drawAnvilBed(anvilY) {
            // Resortes verdes inferiores cuando el chat usa !salvar
            [-145, 0, 145].forEach(ox => {
                const sx = W / 2 + ox;
                ctx.strokeStyle = game.springAnim > 0 ? '#2aff00' : '#10b981';
                ctx.lineWidth = 5;
                ctx.beginPath();
                for (let z = 0; z <= 3; z++) {
                    const zy = anvilY + 4 + z * 6;
                    const zx = sx + (z % 2 === 0 ? -15 : 15);
                    if (z === 0) ctx.moveTo(sx, anvilY + 2);
                    else ctx.lineTo(zx, zy);
                }
                ctx.stroke();
            });

            ctx.fillStyle = '#334155';
            ctx.fillRect(8, anvilY, W - 16, 20);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.strokeRect(8, anvilY, W - 16, 20);
        }

        /************************************************************************
         * 5. BUCLE DE ANIMACIÓN Y CONEXIÓN TIKFINITY (ws://localhost:21213/)
         ************************************************************************/
        let lastTime = performance.now();

        function updateLoop(dt) {
            if (game.shakeTimer > 0) game.shakeTimer = Math.max(0, game.shakeTimer - dt);
            if (game.springAnim > 0) game.springAnim = Math.max(0, game.springAnim - dt * 2.5);

            if (game.feverTimer > 0) {
                game.feverTimer = Math.max(0, game.feverTimer - dt);
                game.pistonHeat = 1.0;
            } else if (game.pistonHeat > 0) {
                game.pistonHeat = Math.max(0, game.pistonHeat - dt * 0.35);
            }

            if (game.comboTimer > 0) {
                game.comboTimer -= dt;
                if (game.comboTimer <= 0) {
                    game.comboCount = 0;
                    game.comboMult = 1;
                }
            }

            if (game.shockwaveRadius > 0) {
                game.shockwaveRadius += 720 * dt;
                if (game.shockwaveRadius > 540) game.shockwaveRadius = 0;
            }

            for (let i = game.bolts.length - 1; i >= 0; i--) {
                game.bolts[i].life -= dt;
                if (game.bolts[i].life <= 0) game.bolts.splice(i, 1);
            }

            if (game.state === 'CRUSHING') {
                if (game.crushLikes > 0 && game.crushLikes < game.maxLikesRequired) {
                    const pushBack = game.regenBase * (game.isBoss ? 0.028 : 0.015) * dt;
                    game.crushLikes = Math.max(game.checkpoint, game.crushLikes - pushBack);
                }

                const target = Math.max(0, Math.min(1, game.crushLikes / game.maxLikesRequired));
                game.visualRatio += (target - game.visualRatio) * Math.min(1, dt * 12);

                if (game.visualRatio >= 0.85) {
                    game.sirenTimer -= dt;
                    if (game.sirenTimer <= 0) {
                        game.sirenTimer = 0.55;
                        sfx.siren();
                    }
                }

                if (game.isBoss) {
                    game.bossTime = Math.max(0, game.bossTime - dt);
                    if (game.bossTime <= 0) {
                        setupObject(Math.floor(Math.random() * OBJECT_CATALOG.length), false);
                    }
                }
            } else if (game.state === 'EXPLODED') {
                game.explodedTimer -= dt;
                if (game.explodedTimer <= 0) {
                    const nextIdx = game.queuedNextIdx !== null
                        ? game.queuedNextIdx
                        : Math.floor(Math.random() * OBJECT_CATALOG.length);
                    game.queuedNextIdx = null;
                    setupObject(nextIdx, false);
                }
            }

            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += p.g * dt;
                p.rot += p.vRot * dt;
                if (p.y > 444 && p.vy > 0) {
                    p.y = 444;
                    p.vy = -p.vy * 0.42;
                    p.vx *= 0.78;
                }
                p.life -= dt;
                if (p.life <= 0) game.particles.splice(i, 1);
            }

            for (let i = game.floatingTexts.length - 1; i >= 0; i--) {
                const ft = game.floatingTexts[i];
                ft.y += ft.vy * dt;
                ft.life -= dt;
                if (ft.life <= 0) game.floatingTexts.splice(i, 1);
            }
        }

        function animate(now) {
            const dt = Math.min(0.1, (now - lastTime) / 1000);
            lastTime = now;
            updateLoop(dt);
            renderCornerOverlay(now / 1000);
            requestAnimationFrame(animate);
        }

        // Conexión automática a TikFinity cada 2.5 segundos
        let ws = null;
        const TF_PORT = new URLSearchParams(location.search).get('port') || '21213';
        const TF_HOSTS = ['127.0.0.1', 'localhost'];
        let tfHostIdx = 0;
        const tfUser = (d, fb) => {
            const u = (d && d.user) || {};
            return String(d.uniqueId || u.uniqueId || d.nickname || u.nickname || fb);
        };
        function connectTikFinity() {
            try {
                if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
                const host = TF_HOSTS[tfHostIdx % TF_HOSTS.length];
                tfHostIdx++;
                ws = new WebSocket(`ws://${host}:${TF_PORT}/`);
                ws.onopen = () => {
                    game.wsConnected = true;
                    game.lastEventText = 'Conectado a TikFinity en vivo';
                };
                ws.onmessage = (ev) => {
                    try {
                        const msg = JSON.parse(ev.data);
                        if (msg.event === 'like' && msg.data) {
                            const count = parseInt(msg.data.likeCount, 10) || 1;
                            const u = tfUser(msg.data, 'viewer');
                            addPressure(count, u, null);
                        } else if (msg.event === 'gift' && msg.data) {
                            if (msg.data.giftType === 1 && msg.data.repeatEnd === false) return;
                            const u = tfUser(msg.data, 'VIP');
                            const gName = (msg.data.giftName || 'REGALO').toUpperCase();
                            game.pistonHeat = 1.0;
                            game.shockwaveRadius = 15;
                            if (game.iceHp > 0) game.iceHp = 0;
                            addPressure(Math.round(game.maxLikesRequired * GIFT_DAMAGE_PCT), u, `🎁 ¡${gName} 1000T!`);
                            game.lastEventText = `🎁 @${u.slice(0, 10)} (${gName} 1000T)`;
                        } else if (msg.event === 'chat' && msg.data) {
                            const c = (msg.data.comment || '').trim().toLowerCase();
                            const u = tfUser(msg.data, 'chat');
                            if (c.startsWith('!objeto')) {
                                const n = parseInt(c.replace('!objeto', '').trim(), 10);
                                if (n >= 1 && n <= OBJECT_CATALOG.length) {
                                    game.queuedNextIdx = n - 1;
                                    game.lastEventText = `📦 @${u.slice(0, 10)} pidió #${n}`;
                                }
                            } else if (c.includes('!random')) {
                                game.queuedNextIdx = Math.floor(Math.random() * OBJECT_CATALOG.length);
                                game.lastEventText = `🎲 @${u.slice(0, 10)} pidió !random`;
                            } else if (c.includes('!salvar') || c === 'salvar') {
                                liftPress(u, 0.16);
                            } else if (c.includes('!romper') || c === 'romper') {
                                addPressure(12, u, '❤️ ¡ROMPER!');
                            }
                        }
                    } catch (e) { console.warn('Mensaje TikFinity no procesado:', e); }
                };
                ws.onerror = () => { game.wsConnected = false; };
                ws.onclose = () => { game.wsConnected = false; };
            } catch (e) {
                game.wsConnected = false;
            }
        }

        setInterval(connectTikFinity, 2500);

        // Clic izquierdo directo en la prensa para probar manualmente con el mouse
        canvas.addEventListener('pointerdown', () => {
            addPressure(12, 'viewer_live', null);
        });

        // Controles flotantes al pasar el mouse arriba a la derecha
        const overlayRoot = document.getElementById('overlayRoot');
        const chromaBtn = document.getElementById('chromaToggleBtn');
        if (chromaBtn) {
            chromaBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                game.chromaMode = !game.chromaMode;
                document.body.classList.toggle('chroma-body', game.chromaMode);
                if (overlayRoot) overlayRoot.classList.toggle('chroma-mode', game.chromaMode);
            });
        }

        const soundBtn = document.getElementById('soundToggleBtn');
        if (soundBtn) {
            soundBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sfx.muted = !sfx.muted;
                soundBtn.textContent = sfx.muted ? '🔇' : '🔊';
            });
        }

        // Descarga del archivo 100% puro sin menú flotante
        const downloadBtn = document.getElementById('downloadHtmlBtn');
        if (downloadBtn) {
            downloadBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const clone = document.documentElement.cloneNode(true);
                const tools = clone.querySelector('#hoverTools');
                if (tools) tools.remove();
                const html = '<!DOCTYPE html>\n' + clone.outerHTML;
                const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'prensa_hidraulica_mini_oscuro.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        if (QP.has('chroma')) {
            game.chromaMode = true;
            document.body.classList.add('chroma-body');
        }
        setupObject(0, false);
        renderCornerOverlay(0);
        connectTikFinity();
        requestAnimationFrame(animate);
    </script>

</body></html>
